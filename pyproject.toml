[project]
name = "essay-writer"
version = "0.1.0"
description = "Confirm-gated MCP server for university essays. Word only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
essay-writer = "essay_writer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
essay_writer = ["FIRST-RUN.txt", "FRIEND-PROMPT.txt", "BUILD-COMMIT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/essay_writer/writing_basics.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
packages = ["essay_writer"]
ignore_missing_imports = true
