name: Release

# Immutable releases reject asset uploads after publication. Tag the commit,
# create a draft release for that tag, dispatch this workflow with the tag
# input, then publish the draft after the assets are signed and attested.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag of a draft release to build and attach assets to (for example v0.2.1)"
        required: true
        type: string

# Read-only by default (Token-Permissions). The release job below opts in to
# the three write permissions it needs, and only for workflow_dispatch, never
# for pull requests.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Test, build, sign, and attest release assets
    # Pinned runner image, not ubuntu-latest: a floating image silently changes
    # the build environment and weakens the reproducible-build proof. The
    # reproduce workflow rebuilds on the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare packaging files for tags cut before this workflow
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          fetch_from_default() {
            name="$1"
            if [ -f "${name}" ]; then
              echo "Using ${name} from the tagged tree."
              return 0
            fi
            # Legacy tags (for example v0.2.1) predate the reproducible
            # packaging files. Artifacts are still built from the tagged
            # source; only the packaging scaffolding comes from the
            # default-branch commit this workflow was dispatched from.
            echo "Tag ${TAG} has no ${name}; reading it from ${default_branch}."
            mkdir -p "$(dirname "${name}")"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${name}?ref=${default_branch}" \
              --jq '.content' | base64 -d > "${name}"
          }
          fetch_from_default requirements-build.txt
          fetch_from_default requirements-ci.txt
          fetch_from_default MANIFEST.in
          fetch_from_default tools/normalize_sdist.py
          fetch_from_default tools/reproducible_build.py

      - name: Set up Python 3.12.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12.13"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Set SOURCE_DATE_EPOCH from the tagged commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Verify the tag exists and was checked out
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "::error::No tag supplied; set the workflow_dispatch 'tag' input or publish a release."
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} does not exist in ${GITHUB_REPOSITORY}. Not creating or moving tags."
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/${TAG}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "::error::Checked-out commit ${head_commit} is not tag ${TAG} (${tag_commit})."
            exit 1
          fi

      - name: Verify the tag matches the package version
        run: |
          set -euo pipefail
          tag_version="${TAG#v}"
          pyproject_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "${tag_version}" != "${pyproject_version}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${pyproject_version}."
            exit 1
          fi
          echo "Tag ${TAG} matches pyproject.toml version ${pyproject_version}."

      - name: Verify the release is a draft
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
          if [ "${is_draft}" != "true" ]; then
            echo "::error::Release ${TAG} must be a draft before assets are built; publish it only after this workflow succeeds."
            exit 1
          fi

      - name: Build twice and require identical hashes
        run: python tools/reproducible_build.py --outdir dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Install test tooling
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Test the wheel and run the full suite from the sdist
        run: |
          set -euo pipefail
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import pathlib

          import essay_writer

          package = pathlib.Path(essay_writer.__file__).parent
          for name in ("FIRST-RUN.txt", "FRIEND-PROMPT.txt", "_vendor/VENDOR.json"):
              assert (package / name).is_file(), f"wheel is missing {name}"
          print("wheel import ok:", essay_writer.__version__, package)
          PY
          mkdir -p "$RUNNER_TEMP/sdist"
          tar xzf "$GITHUB_WORKSPACE"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          for required in tests/conftest.py tests/helpers.py tests/pty_support.py tests/fixtures tests/snapshots/prompts.json .gitignore; do
            test -e "$required" || { echo "the sdist is missing $required"; exit 1; }
          done
          # The suite asks git for HEAD and for the tracked file list, and an
          # sdist is not a checkout. Give the extracted tree a throwaway repo.
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "extracted sdist"
          python -m pytest -q

      - name: Require the sdist to carry every tracked file and rebuild its wheel
        run: |
          set -euo pipefail
          # "Tracked" is defined by the tagged checkout the artifacts were built
          # from. The sdist is the build source of record, so a tracked file
          # missing from it means docs or build inputs are missing from what
          # users get.
          missing=0
          while IFS= read -r -d '' path; do
            if [ ! -e "$RUNNER_TEMP/sdist/$path" ]; then
              echo "::error::the sdist is missing tracked file $path"
              missing=$((missing + 1))
            fi
          done < <(git ls-files -z)
          if [ "$missing" -ne 0 ]; then
            echo "the sdist is missing $missing tracked files"
            exit 1
          fi
          echo "the sdist carries all $(git ls-files | wc -l) tracked files"
          # `pip install <sdist>` builds exactly this wheel. It must be
          # byte-identical to the released wheel; SOURCE_DATE_EPOCH is inherited
          # from the tagged commit, not read from the extracted tree's throwaway
          # git repo.
          cd "$RUNNER_TEMP/sdist"
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/from-sdist"
          release_wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          sdist_wheel="$(ls "$RUNNER_TEMP"/from-sdist/*.whl)"
          sha256sum "$release_wheel" "$sdist_wheel"
          if [ "$(sha256sum "$release_wheel" | cut -d' ' -f1)" != "$(sha256sum "$sdist_wheel" | cut -d' ' -f1)" ]; then
            echo "::error::the wheel built from the sdist is not identical to the release wheel"
            exit 1
          fi
          echo "the sdist->wheel build is byte-identical to the release wheel"

      - name: Verify the GitHub release exists
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::No GitHub release exists for tag ${TAG}. Publish the release before uploading assets."
            exit 1
          fi

      - name: Upload the build artifacts to the release
        run: gh release upload "${TAG}" dist/* --clobber

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # Pin the signer instead of taking the installer's floating default:
          # v3.1.4 is the current stable cosign release (the action version
          # above is commit-pinned, but its default cosign can change).
          cosign-release: "v3.1.4"

      - name: Sign the build artifacts with Sigstore
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in dist/*; do
            case "${file}" in
              *.sigstore.json|dist/provenance.intoto.jsonl) continue ;;
            esac
            echo "Signing ${file}"
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done

      - name: Verify the Sigstore signatures with cosign
        run: |
          set -euo pipefail
          # Verify what was just signed against this workflow's OIDC identity
          # before anything is published. A bundle that does not verify here
          # fails the release instead of shipping an unverifiable signature.
          shopt -s nullglob
          artifacts=()
          for pattern in "dist/*.whl" "dist/*.tar.gz" "dist/SHA256SUMS"; do
            for artifact in ${pattern}; do
              artifacts+=("${artifact}")
            done
          done
          if [ "${#artifacts[@]}" -ne 3 ]; then
            echo "::error::expected the wheel, the sdist, and SHA256SUMS to sign; found ${#artifacts[@]} file(s)"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            echo "Verifying ${artifact}.sigstore.json"
            cosign verify-blob \
              --bundle "${artifact}.sigstore.json" \
              --certificate-identity "https://github.com/4zhmv6zvj2-afk/grokbot-essay-writer/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${artifact}"
          done
          echo "cosign verified the wheel, the sdist, and SHA256SUMS against the release workflow identity."

      - name: Upload the signature bundles to the release
        run: gh release upload "${TAG}" dist/*.sigstore.json --clobber

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload the provenance bundle to the release
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.intoto.jsonl
          gh release upload "${TAG}" dist/provenance.intoto.jsonl --clobber

      - name: Verify the build provenance with gh attestation verify
        run: |
          set -euo pipefail
          # The attestations API can lag right after the upload; retry briefly
          # so propagation delay cannot mask a bad attestation. Each artifact
          # is checked separately: gh attestation verify takes one file.
          verify_attestation() {
            artifact="$1"
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "${artifact}" --repo 4zhmv6zvj2-afk/grokbot-essay-writer; then
                return 0
              fi
              echo "::warning::build provenance for ${artifact} did not verify (attempt ${attempt}); retrying"
              sleep 10
            done
            echo "::error::the build provenance attestation for ${artifact} did not verify"
            return 1
          }
          shopt -s nullglob
          for artifact in dist/*.whl dist/*.tar.gz; do
            echo "Verifying the build provenance of ${artifact}"
            verify_attestation "${artifact}"
          done
          echo "gh verified the build provenance of the wheel and the sdist."

      - name: Assets are attached; publish the draft
        run: |
          echo "::notice::Assets are uploaded, signed, and attested. Publish draft release ${TAG} to make it immutable."
