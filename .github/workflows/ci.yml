name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch program.md >/dev/null 2>&1; then
            echo "local notes must stay untracked"
            exit 1
          fi
          if ! git check-ignore -q program.md; then
            echo "local notes must be ignored"
            exit 1
          fi
          files=$(git ls-files 'README.md' 'FIRST-RUN.txt' 'FRIEND-PROMPT.txt' 'docs/*.md')
          hits=$(grep -nE '(^|[^A-Za-z0-9_.])(dig|ship|land|seat)([^A-Za-z0-9_-]|$)' $files || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "private label in a tracked doc"
            exit 1
          fi
          tracked=$(git ls-files | grep -v '^\.github/')
          path_hits=$(grep -nEi 'ssd[ ]storage|twin[-]drive|(^|[^A-Za-z])cam[e]l([^A-Za-z]|$)' $tracked || true)
          if [ -n "$path_hits" ]; then
            echo "$path_hits"
            echo "machine-specific path in a tracked file"
            exit 1
          fi
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest -q
