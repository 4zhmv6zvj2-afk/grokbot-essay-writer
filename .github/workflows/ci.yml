name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push or PR update supersedes the run in flight; only the latest
# commit needs green checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Pinned runner image, not ubuntu-latest: the release build (and the
    # reproduce workflow that re-checks it) runs on ubuntu-24.04, so CI should
    # test and build on the same image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Version-policy lines, not patch pins: check-latest resolves the latest
        # patch in each line and the job prints it. The floor is 3.12.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Read-only job: no step pushes, and the token stays out of .git config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
      - name: Show interpreter
        run: python -VV
      - name: Repository checks
        run: |
          set -euo pipefail
          local_notes=$(git ls-files '*.local.md' 'NOTES.local' 'LOCAL-NOTES.md' || true)
          if [ -n "$local_notes" ]; then
            echo "local notes must stay untracked"
            exit 1
          fi
          tracked=$(git ls-files | grep -v '^\.github/' || true)
          # Only documented placeholder home/volume paths are allowed. Any other
          # real path is machine-specific and must not be published. The allowed
          # owners are the canonical doc/test placeholders: student, example,
          # alice, bob, user, you; the allowed volumes: ResearchDrive,
          # ArchiveDrive, workspace, Data.
          path_hits=$(grep -noE '/(Users|Volumes|home)/[A-Za-z0-9][A-Za-z0-9._-]*' $tracked \
            | grep -vE '/(Users|Volumes|home)/(student|example|alice|bob|user|you|ResearchDrive|ArchiveDrive|workspace|Data)$' || true)
          if [ -n "$path_hits" ]; then
            echo "$path_hits"
            echo "real home or volume path in a tracked file"
            exit 1
          fi
          # Generic credential material only: private key blocks and well-known
          # token prefixes. This repository is a source-available distribution,
          # so the check polices secrets, not anyone's domain vocabulary.
          secret_hits=$(grep -nE 'BEGIN ([A-Z]+ )?PRIVATE KEY|(^|[^A-Za-z0-9])(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})' $tracked || true)
          if [ -n "$secret_hits" ]; then
            echo "$secret_hits"
            echo "secret material in a tracked file"
            exit 1
          fi
      - name: Install package and dev tools
        run: |
          # requirements-build.txt carries the hash-pinned setuptools/wheel the
          # editable install below needs with --no-build-isolation.
          python -m pip install --require-hashes -r requirements-build.txt -r requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Prompt docs and snapshot
        run: |
          python tools/generate_docs.py --check
          python tools/update_prompt_snapshot.py --check
      - name: Ruff
        run: |
          python -m ruff check src tests tools
          python -m ruff format --check --force-exclude src tests tools
      - name: Mypy
        run: python -m mypy src
      # Coverage is measured once, on the lowest supported interpreter and one
      # platform, so the number is comparable between runs. The floor is 85
      # (see [tool.coverage.report] in pyproject.toml); the current baseline is
      # ~87%.
      - name: Pytest
        if: matrix.python-version != '3.12'
        run: python -m pytest -q
      - name: Pytest with coverage
        if: matrix.python-version == '3.12'
        run: python -m pytest -q --cov=essay_writer --cov-report=term --cov-fail-under=85

  test-macos:
    name: Test (macOS, Python 3.15)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Read-only job: no step pushes, and the token stays out of .git config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
      - name: Install package and dev tools
        run: |
          # requirements-build.txt carries the hash-pinned setuptools/wheel the
          # editable install below needs with --no-build-isolation.
          python -m pip install --require-hashes -r requirements-build.txt -r requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Pytest
        run: python -m pytest -q

  artifacts:
    name: Build and test the shipped artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Read-only job: no step pushes, and the token stays out of .git config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          # Build and test on the lowest supported line: shipped artifacts must
          # install and pass on every Python in the matrix.
          python-version: "3.12"
          check-latest: true
      - name: Install build and test tooling
        run: python -m pip install --require-hashes -r requirements-build.txt -r requirements-ci.txt
      - name: Set SOURCE_DATE_EPOCH from the commit
        # One value for every build below: the double build, the wheel from the
        # checkout, and the wheel rebuilt from the extracted sdist. Do not let
        # the build fall back to git inside the extracted tree: CI creates a
        # fresh commit there, so its commit time would not be the source time.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build twice and require identical hashes
        run: |
          set -euo pipefail
          # Reproducible releases: artifact timestamps come from the commit.
          python tools/reproducible_build.py --outdir dist
          cd dist
          sha256sum *.whl *.tar.gz | tee SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Install the wheel into a clean virtualenv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib

          import essay_writer

          package = pathlib.Path(essay_writer.__file__).parent
          for name in (
              "FIRST-RUN.txt",
              "FRIEND-PROMPT.txt",
              "_vendor/VENDOR.json",
              "prompts/front_office/tools.json",
          ):
              assert (package / name).is_file(), f"wheel is missing {name}"
          print("wheel import ok:", essay_writer.__version__, package)
          PY
      - name: Extract the sdist
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
      - name: Require the sdist to carry every tracked file
        run: |
          set -euo pipefail
          # "Tracked" is defined by the checkout the artifact was built from.
          # The sdist is the build source of record, so a tracked file missing
          # from it means docs or build inputs are missing from what users get.
          missing=0
          while IFS= read -r -d '' path; do
            if [ ! -e "$RUNNER_TEMP/sdist/$path" ]; then
              echo "::error::the sdist is missing tracked file $path"
              missing=$((missing + 1))
            fi
          done < <(git ls-files -z)
          if [ "$missing" -ne 0 ]; then
            echo "the sdist is missing $missing tracked files"
            exit 1
          fi
          echo "the sdist carries all $(git ls-files | wc -l) tracked files"
      - name: Build a wheel from the extracted sdist and compare hashes
        run: |
          set -euo pipefail
          # `pip install <sdist>` builds exactly this wheel. It must be
          # byte-identical to the wheel built from the checkout; the
          # SOURCE_DATE_EPOCH above is inherited from the commit.
          cd "$RUNNER_TEMP/sdist"
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/from-sdist"
          checkout_wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          sdist_wheel="$(ls "$RUNNER_TEMP"/from-sdist/*.whl)"
          sha256sum "$checkout_wheel" "$sdist_wheel"
          if [ "$(sha256sum "$checkout_wheel" | cut -d' ' -f1)" != "$(sha256sum "$sdist_wheel" | cut -d' ' -f1)" ]; then
            echo "::error::the wheel built from the sdist is not identical to the checkout wheel"
            exit 1
          fi
          echo "the sdist->wheel build is byte-identical to the checkout wheel"
      - name: Run the full suite from the extracted sdist
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sdist"
          for required in tests/conftest.py tests/helpers.py tests/pty_support.py tests/fixtures tests/snapshots/prompts.json .gitignore; do
            test -e "$required" || { echo "the sdist is missing $required"; exit 1; }
          done
          # The suite asks git for HEAD and for the tracked file list, and an
          # sdist is not a checkout. Give the extracted tree a throwaway repo so
          # the same tests run against the shipped source.
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "extracted sdist"
          python -m pytest -q
